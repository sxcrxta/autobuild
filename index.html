<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autobuild 공방</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<link rel="stylesheet" href="rooms/room.css">
<link rel="stylesheet" href="rooms/pix.css">
<style>
:root{--bg:#16121c;--panel:#211b2a;--panel2:#2a2235;--line:#3a2f48;--ink:#f4ecdc;--sub:#b9adc9;--dim:#83789a;
  --accent:#ffcf5a;--green:#5fe38a;--red:#ff6b6b;--blue:#7cc4ff;--pink:#ff9fc4;--outline:#2b2233;--muted:#b9adc9}
html,body{height:100%}
body{display:block;padding:0;min-height:100vh;font-size:13px;overflow-x:hidden}
button,select,textarea,input{font-family:var(--font);color:inherit}
.px{image-rendering:pixelated}

/* ── 상단 바 ── */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(22,18,28,.92);
  backdrop-filter:blur(6px);border-bottom:2px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.5px}
.brand i{width:12px;height:12px;background:var(--accent);box-shadow:4px 4px 0 #b9862a}
.top select{background:var(--panel);border:2px solid var(--line);padding:5px 8px;font-size:12px;cursor:pointer}
.livepill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);border:2px solid var(--line);padding:4px 8px;background:var(--panel)}
.livepill b{width:8px;height:8px;background:var(--dim)}
.msg.canceled .tx{text-decoration:line-through;opacity:.55}
.usage.warn{color:#ffd88a}.usage.bad{color:#ff9d9d;box-shadow:0 0 0 2px var(--outline),inset 0 0 0 2px #b04848}
.livepill.on{color:#9ff3bd;border-color:#2f6b45}.livepill.on b{background:var(--green);animation:blink 1s steps(2) infinite}
.phases{display:flex;gap:2px}
.phases button{background:var(--panel);border:2px solid var(--line);padding:4px 8px;font-size:11px;color:var(--dim);cursor:pointer}
.phases button.done{color:var(--sub);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.phases button.cur{background:var(--accent);border-color:var(--accent);color:#2b2233}
.phases button:hover{border-color:var(--accent)}
.top .sp{flex:1}
.tbtn{background:var(--panel);border:2px solid var(--line);padding:5px 10px;font-size:12px;cursor:pointer;text-decoration:none;color:var(--ink)}
.tbtn:hover{border-color:var(--accent)}
.tbtn.hi{background:var(--accent);border-color:var(--accent);color:#2b2233}
.clock{font-size:12px;color:var(--dim)}
@media (max-width:1560px){.clock{display:none}.phases button{padding:4px 6px}}

/* ── 본문 ── */
.layout > *{min-width:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:14px 18px 24px;max-width:1760px;margin:0 auto}
.stagebar{display:flex;align-items:flex-end;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.stagebar h1{margin:0;font-size:20px}
.stagebar .sum{color:var(--sub);font-size:12px;line-height:1.5;margin-top:4px;max-width:720px;overflow-wrap:anywhere}
.kpis{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.kpi{background:var(--panel);border:2px solid var(--line);padding:5px 9px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.kpi:hover{border-color:var(--accent)}
.kpi b{color:var(--ink)}.kpi span{color:var(--sub)}
.kpi.warn{border-color:#7a3a3a}.kpi.warn b{color:var(--red)}
.kpi.req b{color:var(--pink)}

.officewrap{position:relative}
.sz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:8px 0}
.sz-grid button{text-align:left;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;color:var(--ink);font:inherit}
.sz-grid button.on{border-color:var(--accent)}.sz-grid b{font-size:16px}.sz-grid small{display:block;color:var(--sub);font-size:11.5px;margin-top:3px}
.sz-grid .fit{float:right;font-size:11px;color:var(--dim)}
.gauge{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 10px}.gauge i{display:block;height:100%;background:var(--accent)}
.gauge.warn i{background:#ff7b7b}
.feat{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.feat input{margin-top:3px;width:18px;height:18px;cursor:pointer}.feat small{display:block;color:var(--sub);font-size:11.5px}
.cpcard{margin:10px 0 12px;padding:14px 16px;border:2px solid var(--accent);border-radius:12px;background:var(--panel2)}
.cpcard h3{margin:0 0 6px;font-size:15px;color:var(--accent)}
.cpcard .q{font-size:17px;margin:0 0 8px;color:var(--ink)}
.cpcard .body{white-space:pre-wrap;color:var(--sub);font-size:12.5px;margin:0 0 10px}
.cpcard .imgs{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px}
.cpcard .imgs img{max-height:260px;max-width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.cpcard .opts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.cpcard .opts button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:13px}
.cpcard .opts button.on{border-color:var(--accent);background:#3a3020}
.cpcard .opts button .d{color:var(--dim);font-size:11px;margin-left:4px}
.cpcard textarea{width:100%;box-sizing:border-box;min-height:52px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.cpcard .go{margin-top:8px;padding:9px 16px;border-radius:8px;border:0;background:var(--accent);color:#1a1408;font-weight:700;cursor:pointer}
.cpcard .done{color:var(--green);font-size:13px}
#scene{max-width:none;border:4px solid var(--outline);box-shadow:0 0 0 2px var(--line),0 12px 30px rgba(0,0,0,.45)}
#card{display:none!important}
#hint{top:auto;bottom:2%}

/* 사무실 위에 열리는 패널 */
.sheet{position:absolute;top:6px;right:6px;bottom:6px;width:min(420px,62%);background:#fff8e8;color:#2b2233;border:4px solid var(--outline);
  box-shadow:6px 6px 0 rgba(0,0,0,.45);z-index:40;display:flex;flex-direction:column;transform:translateX(16px);opacity:0;pointer-events:none;transition:.16s}
.sheet.on{transform:none;opacity:1;pointer-events:auto}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 8px;border-bottom:2px dashed #d8c8a8}
.sheet .hd img{width:42px;height:42px;image-rendering:pixelated;background:#f0e2c4;border:2px solid var(--outline)}
.sheet h2{margin:0;font-size:16px}
.sheet .sub{font-size:11px;color:#7a6a8f;margin-top:3px}
.sheet .x{margin-left:auto;background:none;border:none;font-size:18px;cursor:pointer;color:#2b2233;padding:0 2px}
.sheet .bd{padding:10px 14px 16px;overflow:auto;font-size:12.5px;line-height:1.7;flex:1}
.sheet p{margin:.4em 0}.sheet ul{margin:.3em 0;padding-left:1.2em}
.sheet code,.sheet pre{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#2b2233;color:#b8f5c8}
.sheet code{padding:0 4px}.sheet pre{padding:8px 10px;white-space:pre-wrap;margin:.5em 0;word-break:break-word}
.sheet .tag{display:inline-block;font-size:11px;border:2px solid #2b2233;padding:0 5px;margin:0 4px 4px 0;background:#fff}
.sheet .sw{display:inline-block;width:24px;height:24px;border:2px solid #2b2233;margin:2px;vertical-align:middle}
.sheet .live{background:#e9fff0;border:2px dashed #3aa865;padding:6px 8px;margin-top:10px;font-size:12px}
.sheet .meter{height:10px;border:2px solid #2b2233;background:#fff;margin:4px 0 8px}.sheet .meter i{display:block;height:100%;background:#ff6b6b}
.sheet h3{font-size:12px;margin:14px 0 6px;color:#7a6a8f}
.sheet .row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dotted #d8c8a8}
.sheet .row:last-child{border-bottom:none}
.sheet .row .ic{flex:none;width:18px;text-align:center}
.sheet .row .m{font-size:11px;color:#7a6a8f}
.sheet .chip{display:inline-block;font-size:10.5px;border:1.5px solid #2b2233;padding:0 4px;margin-right:4px;background:#fff}
.sheet .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sheet .btnrow button,.sheet .sbtn{background:#fff;border:2px solid #2b2233;padding:4px 8px;font-size:12px;cursor:pointer;color:#2b2233}
.sheet .btnrow button:hover,.sheet .sbtn:hover{background:var(--accent)}
.sheet .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sheet .grid figure{margin:0;cursor:pointer;border:2px solid #2b2233;background:#2b2233}
.sheet .grid img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#111}
.sheet .grid figcaption{font-size:10.5px;color:#f4ecdc;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .stp{display:flex;gap:8px;padding:5px 0}
.sheet .stp i{flex:none;width:12px;height:12px;border:2px solid #2b2233;margin-top:3px;background:#fff}
.sheet .stp.done i{background:#5cb85c}.sheet .stp.cur i{background:var(--accent);animation:blink 1s steps(2) infinite}
.sheet .stp.cur b{color:#b06a00}
.sheet textarea{width:100%;min-height:70px;resize:vertical;border:2px solid #2b2233;padding:6px 8px;font-size:12.5px;background:#fff;color:#2b2233}
.sheet .rep{border:2px solid #2b2233;background:#fff;padding:8px 10px;margin:8px 0;box-shadow:3px 3px 0 rgba(0,0,0,.15)}
.sheet .rep.unread{border-color:#e0457b;box-shadow:3px 3px 0 #ffb3c7}
.sheet .rep .rh{display:flex;gap:6px;align-items:center;font-size:12px}.sheet .rep .rh .m{margin-left:auto;font-size:10.5px;color:#7a6a8f}
.sheet .rep .hl{font-size:13.5px;margin:4px 0 2px;line-height:1.5}
.sheet .rep .bar{height:8px;background:#efe6d6;border:1px solid #2b2233;margin:4px 0}.sheet .rep .bar i{display:block;height:100%;background:#5bbf8a}
.sheet .rep ul{margin:2px 0 0;padding-left:1.1em;font-size:12px;line-height:1.6;color:#4a3f5e}
.msg.report .tx{border-color:var(--accent);background:#2f2a1e}
.msg.report .tx b{color:var(--accent)}
.st-new{color:#c0392b}.st-sent{color:#b06a00}.st-done{color:#2e8b57}

/* 토스트 */
.toast{position:absolute;left:10px;top:10px;z-index:45;background:#2b2233;color:var(--ink);border:2px solid var(--accent);padding:8px 10px;
  display:flex;gap:10px;align-items:center;font-size:12px;box-shadow:4px 4px 0 rgba(0,0,0,.4);max-width:70%;opacity:0;transform:translateY(-6px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast img{width:64px;height:40px;object-fit:cover;border:2px solid #000}
.toast button{background:var(--accent);border:none;color:#2b2233;padding:4px 8px;cursor:pointer;font-size:12px}

/* 다음 할 일 + 스크린샷 필름 */
.nextline{margin:0 0 10px;background:var(--panel);border:2px solid var(--line);padding:8px 12px;font-size:12px;color:var(--sub);line-height:1.6;cursor:pointer}
.nextline b{color:var(--accent);margin-right:6px}
.empty{color:var(--dim);font-size:12px;padding:14px;text-align:center}

/* ── 채팅 ── */
.chat{position:sticky;top:64px;height:calc(100vh - 80px);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);min-height:420px}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:none;padding:9px 4px;font-size:12px;color:var(--dim);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button small{color:var(--dim);margin-left:3px}
.who-filter{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;color:var(--sub);border-bottom:1px solid var(--line);background:var(--panel2)}
.who-filter button{margin-left:auto;background:none;border:1.5px solid var(--line);padding:1px 6px;font-size:11px;cursor:pointer}
.list{flex:1;overflow-y:auto;padding:10px 10px 4px;scrollbar-color:var(--line) transparent}
.msg{display:flex;gap:8px;padding:6px 4px;border-radius:2px;cursor:pointer}
.msg:hover{background:rgba(255,255,255,.04)}
.msg .av{flex:none;width:34px;height:34px;image-rendering:pixelated;background:#3a3048;border:2px solid var(--outline)}
.msg .em{flex:none;width:34px;height:34px;display:grid;place-items:center;background:#3a3048;font-size:18px}
.msg .hd{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--dim);flex-wrap:wrap}
.msg .hd b{font-size:12px;color:var(--c,var(--ink))}
.msg .hd .t{margin-left:auto}
.msg .tx{background:var(--panel2);border:2px solid #382d45;padding:5px 8px;margin-top:3px;font-size:12.5px;line-height:1.55;word-break:break-word;color:var(--ink)}
.msg.event .tx{border-style:dashed;color:var(--sub)}
.msg.aside .tx{border-color:#5a4a2a}
.msg .orig{font-size:10.5px;color:var(--dim);margin-top:3px;display:none;white-space:pre-wrap;line-height:1.5}
.msg.open .orig{display:block}
.msg .ot{font-size:10.5px;color:var(--dim);background:none;border:none;padding:2px 0 0;cursor:pointer}
.msg.me{flex-direction:row-reverse}
.msg.me .tx{background:#3a2a3a;border-color:var(--pink)}
.msg.me .hd{flex-direction:row-reverse}.msg.me .hd .t{margin-left:0;margin-right:auto}
.msg .stc{font-size:10.5px;margin-top:3px}
.msg.me > div{display:flex;flex-direction:column;align-items:flex-end;max-width:85%}
.msg .shotref{display:block;margin-top:4px;width:120px;border:2px solid #000}
.list code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#15111b;color:#b8f5c8;padding:0 3px}
.typing{font-size:11px;color:var(--dim);padding:6px 10px}
.msg.lead .tx{white-space:pre-wrap;background:#1f2a24;border-color:#2f6b45}
.sysline{font-size:11px;color:var(--dim);text-align:center;padding:6px 0}
.mode{background:var(--panel);border:2px solid var(--line);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.mode.on{background:#2f6b45;border-color:#7be0a4;color:#eafff1}
.log{font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7}
.log div{display:flex;gap:8px;border-bottom:1px dotted #33293f;padding:1px 0}
.log span:first-child{color:var(--dim);flex:none}.log .w{color:var(--accent);flex:none;min-width:70px}
.log .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log .ok{color:#9ff3bd}.log .bad{color:var(--red)}.log .warn{color:var(--accent)}
.compose{border-top:2px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.compose .lb{font-size:11px;color:var(--sub);display:flex;gap:6px;align-items:center}
.compose .lb img{width:40px;height:25px;object-fit:cover;border:1.5px solid #000}
.compose .lb button{margin-left:auto;background:none;border:1.5px solid var(--line);font-size:10.5px;padding:1px 5px;cursor:pointer}
.compose .in{display:flex;gap:6px}
.compose textarea{flex:1;min-height:38px;max-height:120px;resize:vertical;background:#15111b;border:2px solid var(--line);padding:6px 8px;font-size:12.5px;color:var(--ink)}
.compose textarea:focus{outline:none;border-color:var(--pink)}
.compose .send{background:var(--pink);border:none;color:#2b2233;padding:0 12px;cursor:pointer;font-size:12px}
.compose .send:disabled{opacity:.5;cursor:default}
.compose .quick{display:flex;flex-direction:column;gap:5px;max-height:38vh;overflow:auto}
.compose .quick .qrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.compose .quick .qn{font-size:11px;color:var(--accent);min-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compose .quick button{background:#15111b;border:1.5px solid var(--line);color:var(--ink);font-size:11.5px;padding:4px 8px;cursor:pointer;max-width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compose .quick button.on{background:var(--pink);color:#2b2233;border-color:var(--pink)}
.compose .quick button i{font-style:normal;opacity:.7}
.compose .clip{background:none;border:2px solid var(--line);color:var(--ink);padding:0 8px;cursor:pointer;font-size:15px}
.compose.drag{outline:2px dashed var(--pink);outline-offset:-4px}
.compose .att{display:flex;flex-wrap:wrap;gap:6px}
.compose .att span{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);padding:2px 4px;font-size:11px;color:var(--sub);max-width:180px}
.compose .att img{width:40px;height:30px;object-fit:cover;border:1px solid #000}
.compose .att b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compose .att button{background:none;border:none;color:var(--sub);cursor:pointer;padding:0 2px}
.msg .atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:flex-start;justify-content:flex-end}
.msg .atts img{max-width:140px;max-height:110px;border:2px solid #000;cursor:zoom-in}
.msg .atts span{font-size:11px;border:1.5px solid var(--line);padding:2px 6px}

/* ── 스크린샷 뷰어 ── */

@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .chat{position:relative;top:0;height:560px}
}
@media (max-width:640px){
  .top{padding:8px 12px;gap:8px}.phases{display:none}.layout{padding:10px 12px}
  .sheet{width:auto;left:6px}.stagebar h1{font-size:16px}
}

/* ══ v0.16 1인 공방 테마: 밤 공방 남색 + 스탠드 호박색, 계단식 픽셀 테두리 ══ */
:root{--bg:#121027;--panel:#1d1a38;--panel2:#262247;--line:#3b3566;--ink:#f6efe0;--sub:#beb5da;--dim:#8a82ad;
  --accent:#ffc95c;--accent2:#ff8f6b;--green:#6ee7a8;--red:#ff7a7a;--blue:#8cc8ff;--pink:#ff9fc4;--outline:#0b0918;--muted:#beb5da;
  --pxb:0 0 0 2px var(--outline),inset 0 0 0 2px var(--line),inset 2px 2px 0 2px rgba(255,255,255,.04);
  --pxs:4px 4px 0 0 rgba(0,0,0,.35)}
body{background:var(--bg);background-image:radial-gradient(rgba(255,201,92,.06) 1px,transparent 1px),radial-gradient(rgba(140,200,255,.05) 1px,transparent 1px);
  background-size:24px 24px,37px 37px;background-position:0 0,11px 17px}
.top{background:rgba(18,16,39,.94);border-bottom:none;box-shadow:0 2px 0 var(--outline),0 4px 0 var(--line)}
.brand{font-size:16px;gap:9px}.brand small{color:var(--accent);font-size:11px;border:2px solid var(--accent);padding:0 4px;margin-left:2px}
.brand .logo{width:16px;height:16px;background:none;box-shadow:none;position:relative;image-rendering:pixelated;
  background:linear-gradient(var(--accent),var(--accent)) 6px 0/4px 10px no-repeat,linear-gradient(#c98b3a,#c98b3a) 2px 0/12px 4px no-repeat,linear-gradient(#8a5f3f,#8a5f3f) 7px 10px/2px 6px no-repeat}
.tbtn,.top select,.livepill,.kpi,.phases button{border:none!important;box-shadow:var(--pxb);border-radius:0}
.tbtn{transition:transform .05s}.tbtn:hover{box-shadow:0 0 0 2px var(--outline),inset 0 0 0 2px var(--accent)}
.tbtn:active{transform:translate(1px,1px)}
.tbtn.hi{background:var(--accent);color:#24180a;box-shadow:0 0 0 2px var(--outline),inset -2px -2px 0 0 #c98b3a,inset 2px 2px 0 0 #ffe3a3}
.tbtn.arm{background:var(--accent2);color:#2a1208;box-shadow:0 0 0 2px var(--outline),inset -2px -2px 0 0 #b8553a;animation:blink 1s steps(2) infinite}
.tbtn[disabled]{opacity:.5}
.ctl{display:flex;gap:6px}
.phases{gap:4px}.phases button.cur{background:var(--accent);color:#24180a;box-shadow:0 0 0 2px var(--outline),inset -2px -2px 0 0 #c98b3a}
.livepill.on{box-shadow:0 0 0 2px var(--outline),inset 0 0 0 2px #2f7a55}
.kpi{background:var(--panel)}.kpi:hover{box-shadow:0 0 0 2px var(--outline),inset 0 0 0 2px var(--accent)}
.kpi.warn{box-shadow:0 0 0 2px var(--outline),inset 0 0 0 2px #8a3a4a}
.stagebar h1{font-size:22px;text-shadow:2px 2px 0 var(--outline)}

const PH_HINT = { PLAN: '빌더의 질문에 답하며 계획 세우기', BUILD: '기능 하나씩 만들기', VERIFY: '빌더가 검사하고 문제 보고', FINISH: '정리하고 마무리', DONE: '완성' };
async function loadJourney(sig) {
  if (!slug) return;
  const d = await j(`/api/journey?slug=${encodeURIComponent(slug)}`).catch(() => null);
  if (!d || !d.sessions) return;
  JR = d; JR._sig = sig || (CV && CV.sig);
  const per = {}; d.sessions.forEach(x => x.phases.forEach(ph => { per[ph] = (per[ph] || 0) + 1; }));
  K.setConvo({ perPhase: per }); if (S) K.applyState(S);
  $('cMap').textContent = d.sessions.length || '';
  if (tab === 'map') renderJourney();
}
const hhmm = t => String(t || '').slice(11, 16), md5 = t => String(t || '').slice(5, 10).replace('-', '/');
function renderJourney(jump) {
  $('whoFilter').hidden = true; $('typing').hidden = true;
  if (renaming) return;
  if (!JR) { $('list').innerHTML = '<div class="empty">불러오는 중…</div>'; loadJourney(); return; }
  const cur = JR.phase === 'DONE' ? 'DONE' : JR.phase, ci = PH.findIndex(p => p[0] === cur);
  const per = {}; JR.sessions.forEach(x => x.phases.forEach(ph => { per[ph] = (per[ph] || 0) + 1; }));
  const lastWith = [...PH].reverse().map(p => p[0]).find(k => per[k] && k !== 'DONE') || 'PLAN';
  const pick = jrPick || (cur === 'DONE' ? lastWith : cur);
  const steps = PH.filter(p => p[0] !== 'DONE').map(([k, ko], i) => {
    const st = cur === 'DONE' || i < ci ? 'done' : i === ci ? 'cur' : '';
    return `<div class="jp ${st} ${k === pick ? 'pick' : ''}" data-jp="${k}" style="--pc:${PH_COL[k]}"><div class="ic">${st === 'done' ? '✓' : PH_IC[k]}</div><b>${ko}</b><span class="n">${per[k] ? `세션 ${per[k]}` : ''}</span></div>`;
  }).join('');
  const cards = JR.sessions.map((x, i) => [x, i]).filter(([x]) => x.phases.includes(pick)).map(([x, i]) => {
    const mins = Math.max(1, Math.round((new Date(x.t1) - new Date(x.t0)) / 60000));
    return `<div class="sc ${x.now ? 'now' : ''}" style="--pc:${PH_COL[x.phases[x.phases.length - 1]] || 'var(--line)'}">
      <div class="sc-h"><span class="sc-k">#${i + 1}</span><span class="nm">${esc(x.name)}</span><button class="rn" data-rename="${esc(x.sid)}" data-cur="${esc(x.named ? x.name : '')}" title="이름 바꾸기">✏️</button>${x.now ? '<span class="sc-now">● 지금</span>' : ''}</div>
      <div class="sc-m">${md5(x.t0)} ${hhmm(x.t0)}–${hhmm(x.t1)} · ${dur(mins * 60000)} ${x.phases.map(ph => `<span class="sc-ph" style="--pc:${PH_COL[ph] || 'var(--line)'}">${PH_IC[ph] || ''} ${PH_KO[ph] || ph}</span>`).join('')}</div>
      ${x.summary ? `<ul class="sc-s">${x.summary.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : `<div class="sc-w">${x.now ? '작업이 끝나면 요약이 생겨요' : '요약 만드는 중…'}</div>`}
      ${x.files.length ? `<div class="sc-f">${x.files.map(f => `<code>${esc(f)}</code>`).join('')}${x.nfiles > x.files.length ? `<code>+${x.nfiles - x.files.length}</code>` : ''}</div>` : ''}
    </div>`;
  }).join('');
  keepBottom(box => { box.innerHTML = `<div class="jr"><div class="jr-ph">${steps}</div>
    <p class="jr-hint">${PH_IC[cur] || ''} <b>${PH_KO[cur] || cur}</b> · ${esc(PH_HINT[cur] || '')}</p>
    ${JR.auto ? '<p class="jr-hint">🤖 자동 빌드 중이라 빌더가 자체 절차로 진행해요.</p>' : ''}
    <div class="jr-t">${PH_IC[pick] || ''} ${PH_KO[pick] || pick} 단계의 세션 (기능 하나 = 세션 하나)</div>${cards || `<div class="empty">${PH_KO[pick] || pick} 단계 세션이 아직 없어요.</div>`}</div>`; }, jump);
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-t-map]')) { setTab('map'); return; }
  const jp = e.target.closest('[data-jp]'); if (jp) { jrPick = jp.dataset.jp; renderJourney(); return; }
  const b = e.target.closest('[data-rename]'); if (!b) return;
  renaming = true;
  const holder = b.parentElement, nm = holder.querySelector('.nm');
  nm.outerHTML = `<input class="rnin" maxlength="60" placeholder="예: 로그인 화면" value="${esc(b.dataset.cur || '')}">`;
  b.hidden = true;
  const inp = holder.querySelector('.rnin'); inp.focus(); inp.select();
  const done = async save => {
    if (!renaming) return; renaming = false;
    if (save) { await j('/api/session-name', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ slug, sid: b.dataset.rename, name: inp.value }) }).catch(() => null); }
    await pollConvo(true); await loadJourney(); renderSess(); if (tab === 'map') renderJourney();
  };
  inp.onkeydown = ev => { if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); done(true); } else if (ev.key === 'Escape') done(false); };
  inp.onblur = () => done(true);
});
function setPreview() {
  const pv = $('pv'); if (!slug) return;
  const remote = !!window.AB_REMOTE; pv.classList.toggle('remote', remote); $('pvEmpty').hidden = !remote;
  if (remote || pvSlug === slug) return;
  pvSlug = slug; const u = `${PV}/live/${encodeURIComponent(slug)}/`; $('pvOpen').href = u; $('pvFrame').src = u;
}
function reloadPreview() { if (window.AB_REMOTE || !slug) return; const u = `${PV}/live/${encodeURIComponent(slug)}/`; $('pvFrame').src = 'about:blank'; setTimeout(() => { $('pvFrame').src = u; }, 50); }
$('pvReload').onclick = reloadPreview;
function md(t) {  // 빌더 글의 가벼운 마크다운: ```코드```, **굵게**, `코드`, # 제목
  const s = String(t || '').replace(/\/Users\/[^\s]*?\/projects\/[\w.-]+\//g, '');
  const inl = x => esc(x).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/^#{1,4}\s+(.+)$/gm, '<b>$1</b>');
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const text = p => p.replace(/(^|\n)((?:\|[^\n]*\|[ \t]*(?:\n|$))+)/g, (m, pre, blk) => {  // 마크다운 표 → <table>
    const rows = blk.trim().split('\n').filter(l => !/^\|[\s:|-]+\|$/.test(l.trim()));
    return `${pre}\u0000T${rows.map((l, i) => `<tr>${cells(l).map(c => `<${i ? 'td' : 'th'}>${inl(c)}</${i ? 'td' : 'th'}>`).join('')}</tr>`).join('')}\u0000E`;
  });
  return s.split(/```[\w+-]*\n?/).map((p, k) => k % 2 ? `<pre class="cb">${esc(p.replace(/\n$/, ''))}</pre>`
    : text(p).split(/\u0000T|\u0000E/).map((q, i) => i % 2 ? `<div class="tb"><table>${q}</table></div>` : inl(q)).join('')).join('');
}
function logRow(e) {
  let cls = '', b = '';
  switch (e.ev) {
    case 'tool': b = `${e.tool} · ${shortPath(e.detail)}`; break;
    case 'guard_deny': b = `차단 · ${e.reason}`; cls = 'bad'; break;
    case 'phase': b = `단계 → ${e.phase}`; cls = 'ok'; break;
    case 'spawn': b = e.type && HELPERS.some(h => h[0] === e.type) ? `${HELPERS.find(h => h[0] === e.type)[1]} 보조 부름 · ${e.desc || ''}` : `보조 부름 · ${e.type || ''}`; cls = 'ok'; break;
    case 'user_chat': b = `💬 사람 · ${e.text}`; cls = 'warn'; break;
    case 'mode': b = e.auto ? '🤖 자동 빌드 켬' : '💬 대화 모드'; cls = 'ok'; break;
    case 'keepgoing': b = `빌더 재촉 (${e.phase})`; cls = 'warn'; break;
    case 'notify': b = `알림 · ${e.title}`; cls = 'warn'; break;
    case 'user_feedback': b = `🙋 사람 요청 ${e.id} · ${e.text}`; cls = 'warn'; break;
    case 'feedback_sent': b = `📨 빌더에게 전달 ${(e.ids || []).join(', ')}`; cls = 'ok'; break;
    default: return null;
  }
  return `<div><span>${esc((e.t || '').slice(11, 19))}</span><span class="w">${esc(e.agent || (e.ev.startsWith('user') || e.ev.startsWith('feedback') ? '사람' : ''))}</span><span class="x ${cls}" title="${esc(b)}">${esc(b)}</span></div>`;
}
function renderLog(jump) { $('whoFilter').hidden = true; $('typing').hidden = true; keepBottom(box => { box.innerHTML = `<div class="log">${logs.slice(-500).join('')}</div>` || ''; }, jump); }
function onEvent(e) {
  if (e.ev === 'user_chat' || e.ev === 'mode' || (e.ev === 'lead_stop' && (e.last || '').trim())) { conv.push(e); if (conv.length > 400) conv = conv.slice(-300); }
  const row = logRow(e); if (row) logs.push(row);
  if (logs.length > 1200) logs = logs.slice(-800);
}
function counts() { $('cLog').textContent = logs.length || ''; }

async function pollChat(first) {
  if (!slug) return;
  const r = await j(`/api/chatter?slug=${encodeURIComponent(slug)}&after=${chatN}`).catch(() => null); if (!r) return;
  if (first && r.personas) K.setPersonas(r.personas);
  chatPending = r.pending || 0;
  const lines = r.lines || [];
  if (lines.length) {
    chatN = lines[lines.length - 1].n;
    lines.forEach(l => { l.speaker = canon(l.speaker); l.to = canon(l.to); });
    const live = lines.filter(l => l.speaker !== 'free-rider');
    if (first) { lines.slice(0, -2).forEach(addTalk); K.enqueue(live.slice(-2), false); }
    else K.enqueue(live, false);
  }
  if (tab === 'talk') renderTalk(first);
}

/* ── 시작 ── */
let timer = 0, chatTimer = 0, convoTimer = 0, pend = false;
async function refresh() { if (!slug) return; const st = await j(`/api/state?slug=${encodeURIComponent(slug)}`).catch(() => null); if (st && st.status) render(st); }
function soon() { if (pend) return; pend = true; setTimeout(() => { pend = false; refresh(); }, 500); }
async function start() {
  if (es) es.close(); clearInterval(timer); clearInterval(chatTimer); clearInterval(convoTimer);
  talk.length = 0; shown.clear(); chatN = -1; conv = []; logs = []; who = null; closeSheet(); JR = null; renaming = false; jrPick = null; CV = { items: [], busy: false, alive: false, sig: '' }; pendingMsgs = []; botKey = null; BLK = null; sendSig = ''; openTools.clear(); renderSess();
  knownR = null; loadSeen();
  if (!slug) return;
  await refresh();
  try { RAWP = await j('/personas.json'); K.setPersonas(RAWP); } catch {}
  await pollChat(true); await pollConvo(true); loadJourney();
  const { events } = await j(`/api/events?slug=${encodeURIComponent(slug)}&limit=3000`).catch(() => ({ events: [] }));
  events.forEach(onEvent); counts(); renderList(true);
  es = new EventSource(`/stream?slug=${encodeURIComponent(slug)}`);
  es.onmessage = m => { const e = JSON.parse(m.data); onEvent(e); counts(); if (tab !== 'talk') renderList();
    if (['phase', 'spawn', 'working', 'guard_deny', 'keepgoing', 'notify', 'user_feedback', 'feedback_sent', 'agent_stop', 'user_chat', 'lead_stop', 'lead_wake', 'mode', 'launch', 'lead_exit'].includes(e.ev) || /\.png/.test(e.detail || '')) soon(); };
  timer = setInterval(refresh, 6000); chatTimer = setInterval(() => pollChat(false), 3000); convoTimer = setInterval(() => pollConvo(false), 2500);
}
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); }, 1000);
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
loadProjects().then(start); setInterval(loadProjects, 20000);
</script>
